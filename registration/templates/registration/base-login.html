<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    {% load static %}


    <title>{% block title %}Agenda Login{% endblock %}</title>

    <!-- Custom fonts for this template-->
    <link href="{% static 'vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet" type="text/css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="{% static 'css/sb-admin-2.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">

</head>

<body class="login-page">

    <div class="container d-flex justify-content-center">
        <div class="login-card p-4 p-md-5">
            <div class="text-center">
                <div class="login-brand">AGENDA</div>
                {% block auth_heading %}
                <h1 class="h5 text-gray-700 mb-4 font-weight-normal">Bienvenido de nuevo</h1>
                {% endblock %}
            </div>
            
            {% block content %}
            {% endblock %}

            {% block auth_footer %}
            <hr class="my-4" style="opacity: 0.1">
            <div class="text-center d-flex flex-column gap-2">
                <a class="small text-muted mb-2" href="{% url 'password_reset' %}">¿Olvidaste el password?</a>
                <a class="btn btn-outline-primary btn-sm rounded-pill" href="{% url 'signup' %}">Crear una Cuenta</a>
            </div>
            {% endblock %}
        </div>
    </div>

    <!-- Bootstrap core JavaScript-->
    <script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>

    <!-- Core plugin JavaScript-->
    <script src="v{% static 'endor/jquery-easing/jquery.easing.min.js' %}"></script>

    <!-- Custom scripts for all pages-->
    <script src="{% static 'js/sb-admin-2.min.js' %}"></script>

</body>

</html>
